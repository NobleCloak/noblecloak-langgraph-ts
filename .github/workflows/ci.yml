# Two runners per pull request and per push to main, no matrix: GitHub Actions minutes are metered.
# `gate` is what a developer runs locally (`bun run gate`, `bun run guard`) plus actionlint over the workflows.
# `skill` is the setup skill's acceptance run (`bun run exercise:skill`); it needs Node only, no browser.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # format:check, lint, typecheck and test through turbo, then build.
      - run: bun run gate
      - run: bun run guard
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  skill:
    name: skill / langgraph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # Everything else (build, pack, scaffold a LangGraph project, apply the skill, open the proposal against
      # the mock, approve it, run the agent and the worker, the file comparison and the wall time) is the one
      # script a developer runs locally too.
      - name: Exercise the skill on a scaffolded LangGraph project
        run: bun run exercise:skill
      - name: Keep the wall time
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-exercise-langgraph-wall-time
          path: artifacts/skill-exercise-langgraph-wall-time.json
          # The script writes it on a failed run too, so a missing file is worth a warning.
          if-no-files-found: warn
